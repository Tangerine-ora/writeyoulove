name: writeyoulove
description: "WriteYouLove — 面向同人、视觉小说创作的三模式编辑器"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ===== 状态管理 =====
  provider: ^6.1.2

  # ===== 本地存储 =====
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # ===== 富文本编辑器（普通写作模式）=====
  flutter_quill: ^11.6.0

  # ===== WebView（排版模式 + 开发者模式）=====
  webview_flutter: ^4.14.1

  # ===== 工具 =====
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/
